; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
	sparkfun/SparkFun Indoor Air Quality Sensor - ENS160@^1.1.0
	adafruit/Adafruit AHTX0@^2.0.5
	bodmer/TFT_eSPI@^2.5.43
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.1

; ESP32-C3 Pro Mini environment monitor
[env:esp32-c3-envmonitor]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
	-DBOARD_C3_PRO_MINI
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Iinclude
lib_deps =
	${common.lib_deps}

; Applies a one-line fix to TFT_eSPI's ESP32-C3 SPI_PORT (see scripts/patch_tft_espi_c3.py)
extra_scripts = pre:scripts/patch_tft_espi_c3.py
